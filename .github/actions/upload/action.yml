# Guarded artifact upload (ARCHITECTURE §13.3, risk R19). Owner: WP-CI.
#
# The ONLY place in this repository that may use actions/upload-artifact (the policy check enforces it). It first runs
# scripts/check-artifacts.mjs on exactly the same paths, so a qdc core.db, fixtures, raw QF responses, dev packs,
# bundles, executables or fonts can never be uploaded from a public repository. `qf-derived: private-only` applies the
# private-repository rules (databases and fixtures allowed); the guard honours it only when the event payload says
# the repository is private.
name: Upload (guarded)
description: Run scripts/check-artifacts.mjs on the paths, then upload them with actions/upload-artifact

inputs:
  name:
    description: Artifact name
    required: true
  path:
    description: Files, directories or globs to upload, one per line (no `!` exclusions)
    required: true
  retention-days:
    description: Days to keep the artifact
    required: false
    default: '7'
  if-no-files-found:
    description: warn, error or ignore
    required: false
    default: warn
  qf-derived:
    description: >-
      `refuse` (default): the public-repository rules. `private-only`: core.db and fixtures/ may be uploaded, and the
      guard verifies that the repository is private
    required: false
    default: refuse

runs:
  using: composite
  steps:
    - name: Licensing guard (scripts/check-artifacts.mjs)
      shell: bash
      env:
        QD_UPLOAD_PATHS: ${{ inputs.path }}
        QD_UPLOAD_QF_DERIVED: ${{ inputs.qf-derived }}
      run: |
        set -- --from-env QD_UPLOAD_PATHS
        case "$QD_UPLOAD_QF_DERIVED" in
          refuse) ;;
          private-only) set -- "$@" --private ;;
          *) echo "::error title=upload::qf-derived must be refuse or private-only"; exit 2 ;;
        esac
        node "$GITHUB_WORKSPACE/scripts/check-artifacts.mjs" "$@"

    - name: Upload
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
