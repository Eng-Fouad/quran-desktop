# core.db inside the job (ARCHITECTURE §13.3, §13.4, §12.2, §12.4). Owner: WP-CI; the qul source WP13b.
#
# source: qdc (CI). A qdc-built core.db is QF-derived (BRIEF §4, FACT §2.1), so it is built inside each job that needs
# it and is never uploaded or cached while the repository is public. The raw-response cache (data/cache) is restored
# only in a private repository and saved only by pushes to the default branch; its key rotates every 7 days and xtask
# refetches any file older than that (QF terms). Callers end the job with ./.github/actions/scrub.
#
# source: qul (release.yml). The QUL exports are not public: they come from a private store as a tar.gz of the files
# named in data/sources/qul/manifest.toml (`qul-sources-url`, fetched with the bearer `qul-sources-token`). The
# committed manifest is never replaced by the archive's, so `build-core --source qul` checks every file against the
# SHA-256 recorded in the repository. Release is blocked until the QUL/QF permission (FACT §8.1, §15.3 item 1) exists:
# without the two secrets this step fails and says so.
name: core.db
description: Build core.db in this job (qdc from the QDC API, or qul from the private QUL store), assert it and run verify-core

inputs:
  source:
    description: qdc (CI) or qul (release)
    required: false
    default: qdc
  qul-sources-url:
    description: qul only — URL of the tar.gz of the QUL inputs (secret QUL_SOURCES_URL)
    required: false
    default: ''
  qul-sources-token:
    description: qul only — bearer token for that URL (secret QUL_SOURCES_TOKEN)
    required: false
    default: ''
  report:
    description: Where verify-core writes its JSON gate report
    required: false
    default: target/verify-core.json

runs:
  using: composite
  steps:
    - name: Source
      shell: bash
      env:
        QD_SOURCE: ${{ inputs.source }}
      run: |
        case "$QD_SOURCE" in
          qdc|qul) echo "core.db source: $QD_SOURCE" ;;
          *) echo "::error title=core.db::source must be qdc or qul, not '$QD_SOURCE'"; exit 2 ;;
        esac

    - name: Raw-response cache key (7-day buckets; private repository only)
      id: bucket
      if: inputs.source == 'qdc' && github.event.repository.private
      shell: bash
      run: echo "key=qdc-raw-v1-w$(( $(date -u +%s) / 604800 ))" >> "$GITHUB_OUTPUT"

    - name: Restore data/cache (private repository only)
      id: restore
      if: inputs.source == 'qdc' && github.event.repository.private
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: data/cache
        key: ${{ steps.bucket.outputs.key }}
        restore-keys: qdc-raw-v1-

    - name: QUL inputs from the private store (data/sources/qul)
      if: inputs.source == 'qul'
      shell: bash
      env:
        QUL_SOURCES_URL: ${{ inputs.qul-sources-url }}
        QUL_SOURCES_TOKEN: ${{ inputs.qul-sources-token }}
      run: |
        if [ -z "$QUL_SOURCES_URL" ] || [ -z "$QUL_SOURCES_TOKEN" ]; then
          echo "::error title=core.db (qul)::The QUL_SOURCES_URL and QUL_SOURCES_TOKEN secrets are not set. A release core.db is built only from the QUL exports in the private store, and release is blocked until the QUL/QF permission exists (ARCHITECTURE §13.4, §15.3 item 1; docs/RELEASE_CHECKLIST.md)."
          exit 1
        fi
        archive="$RUNNER_TEMP/qul-sources.tar.gz"
        curl --fail --silent --show-error --location --retry 3 --proto '=https' \
          -H "Authorization: Bearer $QUL_SOURCES_TOKEN" -o "$archive" "$QUL_SOURCES_URL"
        # Plain member names only; the committed manifest (with the recorded SHA-256s) is never replaced.
        if tar -tzf "$archive" | grep -E '(^/|(^|/)\.\.(/|$))'; then
          echo "::error title=core.db (qul)::the QUL archive has absolute or '..' member names"
          exit 1
        fi
        tar --exclude manifest.toml --exclude .gitkeep -xzf "$archive" -C data/sources/qul
        rm -f "$archive"
        ls -l data/sources/qul

    - name: cargo xtask build-core --source ${{ inputs.source }}
      shell: bash
      env:
        QD_SOURCE: ${{ inputs.source }}
      run: cargo xtask build-core --source "$QD_SOURCE"

    - name: Assert a real core.db (> 1 MiB, core tables, meta.source = ${{ inputs.source }})
      shell: bash
      env:
        QD_SOURCE: ${{ inputs.source }}
      run: node "$GITHUB_ACTION_PATH/assert-core.mjs" --db src-tauri/resources/core.db --source "$QD_SOURCE"

    - name: cargo xtask verify-core (gates G1–G16)
      shell: bash
      env:
        QD_VERIFY_REPORT: ${{ inputs.report }}
      run: cargo xtask verify-core --db src-tauri/resources/core.db --report "$QD_VERIFY_REPORT"

    - name: Save data/cache (private repository, push to the default branch)
      if: >-
        inputs.source == 'qdc' && github.event.repository.private && github.event_name == 'push' &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
        steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: data/cache
        key: ${{ steps.bucket.outputs.key }}
