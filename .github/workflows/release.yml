# Release (ARCHITECTURE §13.4, §13.6; risk R19). Owner: WP13b.
#
# A `v*` tag builds the installers and the portable builds on five runners, x64 and arm64, and uploads them to a DRAFT
# GitHub release. A person publishes it after docs/RELEASE_CHECKLIST.md; nothing here ever publishes a release.
# Publishing it starts .github/workflows/store.yml (Microsoft Store, Snap Store, App Store Connect).
#   windows-x64      windows-latest    NSIS (current-user install, WebView2 bootstrapper) + portable zip
#   windows-arm64    windows-latest    the same for aarch64-pc-windows-msvc, cross-compiled (MSVC ARM64 tools, clang)
#   macos-universal  macos-latest      one universal dmg + the universal .app zip (aarch64 + x86_64 in one binary)
#   linux-x64        ubuntu-22.04      deb + AppImage (the AppImage is the portable build; the old glibc is deliberate)
#   linux-arm64      ubuntu-22.04-arm  the same for arm64 (an AppImage cannot be cross-built)
# Each build job:
#   1. builds core.db from the QUL exports in the private store (never qdc) and asserts it: > 1 MiB, the core tables,
#      meta.source = 'qul', verify-core (./.github/actions/core with source: qul);
#   2. builds with tauri-action (pinned; build only, it uploads nothing itself) under QD_REQUIRE_CORE=1, signing what
#      is configured (below; otherwise unsigned, and ad hoc on macOS); on Linux, recompresses the deb's payload with xz
#      (scripts/deb-xz.mjs: tauri writes gzip, which cannot meet the 9 MB deb budget);
#   3. packs the portable build (scripts/make-portable.mjs);
#   4. unpacks and checks every installer and portable build (scripts/check-bundles.mjs --core qul --arch: identity,
#      resources, the qul core.db, every binary's architecture, deb Depends and desktop entry, the signatures, …;
#      --signed once the platform's signing is configured) and enforces §13.6 (scripts/size-budget.mjs);
#   5. uploads through ./.github/actions/release-upload, which runs check-artifacts --release first and refuses to
#      touch a release that is no longer a draft;
#   6. Windows, with the Microsoft Store switched on (vars.MS_STORE_ENABLED): re-bundles the NSIS installer with the
#      offline WebView2 runtime the Store requires (`tauri bundle`, no rebuild), checks it (--webview offlineInstaller)
#      and uploads it as Quran_<version>_<arch>-store-setup.exe. It is outside the §13.6 budgets (the runtime alone is
#      over 100 MB) and only store.yml uses it.
# Then `checksums` writes SHA256SUMS over every file of the draft and, with a GPG key, SHA256SUMS.asc.
#
# Release is blocked until the QUL/QF permission exists (FACT §8.1, §15.3 item 1): without the QUL_SOURCES_URL and
# QUL_SOURCES_TOKEN secrets step 1 fails and says so. workflow_dispatch on a branch is a dry run: the same builds and
# checks, nothing uploaded. On a v* tag it (re)fills that tag's draft.
#
# Secrets and variables (environment `release`; each signature is used only when all of its values are set):
#   QUL_SOURCES_URL, QUL_SOURCES_TOKEN   required: a tar.gz of the files named in data/sources/qul/manifest.toml
#   Windows, Azure Artifact Signing (tauri's signCommand signs the exe, the uninstaller and the setup):
#     secrets AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID; variables AZURE_SIGNING_ENDPOINT (e.g.
#     https://weu.codesigning.azure.net), AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE
#   macOS, Developer ID: APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY; notarised
#     with APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID, or with an App Store Connect API key: APPLE_API_ISSUER,
#     APPLE_API_KEY (the key ID) and APPLE_API_KEY_P8 (the .p8's text)
#   Linux and the checksums, GPG: GPG_PRIVATE_KEY (armored), GPG_PASSPHRASE (signed AppImages, SHA256SUMS.asc)
#   vars.MS_STORE_ENABLED = 'true'       also build the Microsoft Store installers (step 6)
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'

defaults:
  run:
    shell: bash

jobs:
  draft:
    name: draft release
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
      tag: ${{ steps.mode.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mode (a v* tag fills its draft release; any other ref is a dry run)
        id: mode
        env:
          QD_REF: ${{ github.ref }}
          QD_REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$QD_REF" == refs/tags/v* ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=$QD_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "Release $QD_REF_NAME: the installers go to its draft release."
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Dry run on $QD_REF: everything is built and checked, nothing is uploaded."
          fi

      - name: The tag is the version of package.json, tauri.conf.json and Cargo.toml
        if: steps.mode.outputs.publish == 'true'
        env:
          QD_TAG: ${{ steps.mode.outputs.tag }}
        run: node scripts/check-version.mjs "$QD_TAG"

      - name: Create the draft release (or reuse this tag's draft)
        if: steps.mode.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          QD_TAG: ${{ steps.mode.outputs.tag }}
        run: |
          if gh release view "$QD_TAG" >/dev/null 2>&1; then
            draft="$(gh release view "$QD_TAG" --json isDraft --jq .isDraft)"
            if [ "$draft" != "true" ]; then
              echo "::error title=Release::$QD_TAG is already published; tag a new version instead"
              exit 1
            fi
            echo "Reusing the draft release $QD_TAG."
          else
            gh release create "$QD_TAG" --draft --verify-tag --title "Quran ${QD_TAG#v}" \
              --notes-file .github/release-notes.md
          fi

  build:
    name: build (${{ matrix.name }})
    needs: draft
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: ''
            arch: x64
            args: ''
            kinds: nsis,portable
            budgets: nsis,installed
            universal: 'false'
          - name: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            arch: arm64
            args: --target aarch64-pc-windows-msvc
            kinds: nsis,portable
            budgets: nsis,installed
            universal: 'false'
          - name: macos-universal
            os: macos-latest
            target: universal-apple-darwin
            arch: arm64
            args: --target universal-apple-darwin
            kinds: dmg,portable
            budgets: dmg,installed
            universal: 'true'
          - name: linux-x64
            os: ubuntu-22.04
            target: ''
            arch: x64
            args: ''
            kinds: deb,appimage
            budgets: deb,appimage,installed
            universal: 'false'
          - name: linux-arm64
            os: ubuntu-22.04-arm
            target: ''
            arch: arm64
            args: ''
            kinds: deb,appimage
            budgets: deb,appimage,installed
            universal: 'false'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          fonts: required

      - name: Rust targets (the universal macOS binary's two, or the cross-compiled one)
        if: matrix.target != ''
        env:
          QD_TARGET: ${{ matrix.target }}
        run: |
          if [ "$QD_TARGET" = "universal-apple-darwin" ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          else
            rustup target add "$QD_TARGET"
          fi

      - name: clang for the arm64 C code (ring, aws-lc-sys), from Visual Studio when it is not on the PATH
        if: matrix.target == 'aarch64-pc-windows-msvc'
        run: |
          if command -v clang >/dev/null; then
            clang --version | head -1
          else
            vs="$("/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath)"
            echo "$vs\\VC\\Tools\\Llvm\\x64\\bin" >> "$GITHUB_PATH"
            echo "clang: $vs\\VC\\Tools\\Llvm\\x64\\bin"
          fi

      - name: core.db (qul from the private store; > 1 MiB, meta.source = qul, verify-core)
        uses: ./.github/actions/core
        with:
          source: qul
          qul-sources-url: ${{ secrets.QUL_SOURCES_URL }}
          qul-sources-token: ${{ secrets.QUL_SOURCES_TOKEN }}

      - name: Which signatures are configured
        id: signing
        env:
          QD_OS: ${{ runner.os }}
          QD_AZURE: >-
            ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_CLIENT_SECRET != '' && secrets.AZURE_TENANT_ID != ''
            && vars.AZURE_SIGNING_ENDPOINT != '' && vars.AZURE_SIGNING_ACCOUNT != '' && vars.AZURE_SIGNING_PROFILE != '' }}
          QD_APPLE: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_SIGNING_IDENTITY != '' }}
          QD_GPG: ${{ secrets.GPG_PRIVATE_KEY != '' }}
        run: |
          signed=false
          case "$QD_OS" in
            Windows) [ "$QD_AZURE" = "true" ] && signed=true ;;
            macOS) [ "$QD_APPLE" = "true" ] && signed=true ;;
          esac
          {
            echo "windows=$([ "$QD_OS" = Windows ] && echo "$QD_AZURE" || echo false)"
            echo "gpg=$QD_GPG"
            echo "signed=$signed"
          } >> "$GITHUB_OUTPUT"
          echo "signing on $QD_OS: windows=$QD_AZURE apple=$QD_APPLE gpg=$QD_GPG (check-bundles --signed: $signed)"

      - name: Windows signing (Azure Artifact Signing through tauri's signCommand)
        id: winsign
        if: steps.signing.outputs.windows == 'true'
        env:
          QD_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          QD_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          QD_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          cargo install artifact-signing-cli --version 0.11.0 --locked
          config="$RUNNER_TEMP/tauri.signing.json"
          # The object form: tauri splits a string signCommand on spaces.
          node -e '
            const [endpoint, account, profile, out] = process.argv.slice(1)
            const args = ["-e", endpoint, "-a", account, "-c", profile, "-d", "Quran", "%1"]
            const config = { bundle: { windows: { signCommand: { cmd: "artifact-signing-cli", args } } } }
            require("node:fs").writeFileSync(out, JSON.stringify(config))
          ' "$QD_ENDPOINT" "$QD_ACCOUNT" "$QD_PROFILE" "$config"
          echo "config=$config" >> "$GITHUB_OUTPUT"
          echo "args=--config $config" >> "$GITHUB_OUTPUT"
          echo "Windows signing: Azure Artifact Signing ($QD_ACCOUNT / $QD_PROFILE)"

      - name: macOS signing (Developer ID and notarisation when configured, else ad hoc)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          QD_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          # tauri-bundler reads these from the environment; an empty APPLE_CERTIFICATE would make it fail, so a
          # variable is exported only when its secret is set.
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              value="${!name}"
              if [ -n "$value" ]; then
                { echo "$name<<QD_EOF"; echo "$value"; echo "QD_EOF"; } >> "$GITHUB_ENV"
              fi
            done
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              echo "macOS signing: Developer ID, notarised with the Apple ID"
            elif [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY" ] && [ -n "$QD_API_KEY_P8" ]; then
              key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
              printf '%s\n' "$QD_API_KEY_P8" > "$key"
              {
                echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
                echo "APPLE_API_KEY=$APPLE_API_KEY"
                echo "APPLE_API_KEY_PATH=$key"
              } >> "$GITHUB_ENV"
              echo "macOS signing: Developer ID, notarised with the App Store Connect API key"
            else
              echo "macOS signing: Developer ID, not notarised (no Apple ID or API key)"
            fi
          else
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "macOS signing: ad hoc with the hardened runtime (no Developer ID configured; docs/deviations/WP13b.md)"
          fi

      - name: GPG key (signed AppImage)
        id: gpg
        if: runner.os == 'Linux' && steps.signing.outputs.gpg == 'true'
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: AppImage signing (tauri's appimagetool signs with the imported key)
        if: steps.gpg.outcome == 'success'
        env:
          QD_KEY: ${{ steps.gpg.outputs.keyid }}
          QD_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          {
            echo "SIGN=1"
            echo "SIGN_KEY=$QD_KEY"
            echo "APPIMAGETOOL_FORCE_SIGN=1"
            echo "APPIMAGETOOL_SIGN_PASSPHRASE<<QD_EOF"
            echo "$QD_PASSPHRASE"
            echo "QD_EOF"
          } >> "$GITHUB_ENV"
          echo "AppImage signing: GPG key $QD_KEY"

      - name: Build the installers (tauri-action; build only, it uploads nothing)
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          QD_REQUIRE_CORE: '1'
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        with:
          tauriScript: pnpm tauri
          args: ${{ matrix.args }} ${{ steps.winsign.outputs.args }}
          uploadWorkflowArtifacts: false

      - name: The bundled core.db is still the qul build
        run: node .github/actions/core/assert-core.mjs --db src-tauri/resources/core.db --source qul

      - name: The deb's payload recompressed with xz (scripts/deb-xz.mjs; tauri writes gzip)
        if: runner.os == 'Linux'
        run: node scripts/deb-xz.mjs

      - name: Portable build (scripts/make-portable.mjs; on Linux the AppImage is the portable build)
        if: runner.os != 'Linux'
        env:
          QD_ARCH: ${{ matrix.arch }}
          QD_TARGET: ${{ matrix.target }}
          QD_UNIVERSAL: ${{ matrix.universal }}
        run: |
          set -- --arch "$QD_ARCH"
          if [ -n "$QD_TARGET" ]; then set -- "$@" --target "$QD_TARGET"; fi
          if [ "$QD_UNIVERSAL" = "true" ]; then set -- "$@" --universal; fi
          node scripts/make-portable.mjs "$@"

      - name: Installer contents (scripts/check-bundles.mjs --core qul)
        env:
          QD_KINDS: ${{ matrix.kinds }}
          QD_ARCH: ${{ matrix.arch }}
          QD_UNIVERSAL: ${{ matrix.universal }}
          QD_SIGNED: ${{ steps.signing.outputs.signed }}
          QD_ARTIFACTS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          echo "tauri-action built: $QD_ARTIFACTS"
          set -- --core qul --require "$QD_KINDS" --arch "$QD_ARCH" --manifest "$RUNNER_TEMP/bundle-check.json"
          if [ "$QD_UNIVERSAL" = "true" ]; then set -- "$@" --universal; fi
          if [ "$QD_SIGNED" = "true" ]; then set -- "$@" --signed; fi
          node scripts/check-bundles.mjs "$@"

      - name: §13.6 budgets (scripts/size-budget.mjs)
        env:
          QD_BUDGETS: ${{ matrix.budgets }}
        run: node scripts/size-budget.mjs --require "$QD_BUDGETS"

      - name: The installers check-bundles verified
        id: files
        run: |
          {
            echo 'files<<QD_EOF'
            node -e '
              const m = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))
              for (const i of m.installers) if (i.ok) console.log(i.file)
            ' "$RUNNER_TEMP/bundle-check.json"
            echo 'QD_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload to the draft release (check-artifacts --release first)
        if: needs.draft.outputs.publish == 'true'
        uses: ./.github/actions/release-upload
        with:
          tag: ${{ needs.draft.outputs.tag }}
          manifest: ${{ runner.temp }}/bundle-check.json
          files: ${{ steps.files.outputs.files }}
          token: ${{ github.token }}

      - name: Microsoft Store installer (offline WebView2; `tauri bundle`, no rebuild)
        id: store
        if: runner.os == 'Windows' && vars.MS_STORE_ENABLED == 'true'
        env:
          QD_REQUIRE_CORE: '1'
          QD_TARGET: ${{ matrix.target }}
          QD_ARCH: ${{ matrix.arch }}
          QD_SIGNING_CONFIG: ${{ steps.winsign.outputs.config }}
          QD_SIGNED: ${{ steps.signing.outputs.signed }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          store="$RUNNER_TEMP/tauri.store.json"
          echo '{"bundle":{"windows":{"webviewInstallMode":{"type":"offlineInstaller"}}}}' > "$store"
          set -- bundle --bundles nsis --config "$store"
          if [ -n "$QD_SIGNING_CONFIG" ]; then set -- "$@" --config "$QD_SIGNING_CONFIG"; fi
          if [ -n "$QD_TARGET" ]; then set -- "$@" --target "$QD_TARGET"; fi
          pnpm tauri "$@"
          release="${CARGO_TARGET_DIR:-target}${QD_TARGET:+/$QD_TARGET}/release"
          setup="$(ls -t "$release"/bundle/nsis/*-setup.exe | head -1)"
          mv "$setup" "${setup%-setup.exe}-store-setup.exe"
          set -- --core qul --require nsis --arch "$QD_ARCH" --webview offlineInstaller \
            --manifest "$RUNNER_TEMP/bundle-check-store.json"
          if [ "$QD_SIGNED" = "true" ]; then set -- "$@" --signed; fi
          node scripts/check-bundles.mjs "$@"
          {
            echo 'files<<QD_EOF'
            node -e '
              const m = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))
              for (const i of m.installers) if (i.ok && i.kind === "nsis") console.log(i.file)
            ' "$RUNNER_TEMP/bundle-check-store.json"
            echo 'QD_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload the Microsoft Store installer to the draft release
        if: steps.store.outcome == 'success' && needs.draft.outputs.publish == 'true'
        uses: ./.github/actions/release-upload
        with:
          tag: ${{ needs.draft.outputs.tag }}
          manifest: ${{ runner.temp }}/bundle-check-store.json
          files: ${{ steps.store.outputs.files }}
          token: ${{ github.token }}

      - name: Scrub build outputs
        if: always()
        uses: ./.github/actions/scrub

  checksums:
    name: checksums
    needs: [draft, build]
    if: needs.draft.outputs.publish == 'true'
    environment: release
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Is a GPG key configured
        id: signing
        env:
          QD_GPG: ${{ secrets.GPG_PRIVATE_KEY != '' }}
        run: echo "gpg=$QD_GPG" >> "$GITHUB_OUTPUT"

      - name: GPG key
        id: gpg
        if: steps.signing.outputs.gpg == 'true'
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: SHA256SUMS of every file of the draft (and SHA256SUMS.asc)
        id: sums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          QD_TAG: ${{ needs.draft.outputs.tag }}
          QD_KEY: ${{ steps.gpg.outputs.keyid }}
          QD_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          assets="$RUNNER_TEMP/assets"
          out="$RUNNER_TEMP/sums"
          mkdir -p "$assets" "$out"
          gh release download "$QD_TAG" --dir "$assets"
          (cd "$assets" && find . -maxdepth 1 -type f ! -name '*.sha256' ! -name 'SHA256SUMS*' -printf '%f\n' \
            | LC_ALL=C sort | xargs -d '\n' sha256sum) > "$out/SHA256SUMS"
          cat "$out/SHA256SUMS"
          files="$out/SHA256SUMS"
          if [ -n "$QD_KEY" ]; then
            gpg --batch --yes --pinentry-mode loopback --passphrase "$QD_PASSPHRASE" --local-user "$QD_KEY" \
              --armor --detach-sign --output "$out/SHA256SUMS.asc" "$out/SHA256SUMS"
            gpg --verify "$out/SHA256SUMS.asc" "$out/SHA256SUMS"
            files="$files"$'\n'"$out/SHA256SUMS.asc"
          fi
          { echo 'files<<QD_EOF'; echo "$files"; echo 'QD_EOF'; } >> "$GITHUB_OUTPUT"

      - name: Upload SHA256SUMS to the draft release (check-artifacts --release first)
        uses: ./.github/actions/release-upload
        with:
          tag: ${{ needs.draft.outputs.tag }}
          files: ${{ steps.sums.outputs.files }}
          token: ${{ github.token }}
          sums: 'false'

  result:
    name: Release result
    if: always()
    needs: [draft, build, checksums]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          QD_PUBLISH: ${{ needs.draft.outputs.publish }}
          QD_TAG: ${{ needs.draft.outputs.tag }}
          QD_SERVER: ${{ github.server_url }}
          QD_REPO: ${{ github.repository }}
        run: |
          node -e '
            const needs = JSON.parse(process.env.NEEDS)
            let ok = true
            for (const [job, { result }] of Object.entries(needs)) {
              console.log(`${job.padEnd(9)} ${result}`)
              // A dry run skips the checksums of the draft it does not fill.
              if (result !== "success" && !(job === "checksums" && result === "skipped")) ok = false
            }
            process.exit(ok ? 0 : 1)
          '
          if [ "$QD_PUBLISH" = "true" ]; then
            {
              echo "### Draft release $QD_TAG"
              echo
              echo "$QD_SERVER/$QD_REPO/releases/tag/$QD_TAG is ready for review."
              echo "Publish it only after every item of docs/RELEASE_CHECKLIST.md is done; publishing starts the"
              echo "store submissions (.github/workflows/store.yml) that are switched on."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
