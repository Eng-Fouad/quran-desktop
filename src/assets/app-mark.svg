<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Single-colour app mark: the قرآن silhouette (128 px raster) masks a currentColor rectangle. Inline it to follow the text colour, or tint it as a CSS mask over any background (assets/brand/README.md). Generated by assets/brand/tools/build.mjs from assets/brand/source (GPL-3.0, Quran.com / quran_android contributors). -->
  <title>Quran</title>
  <mask id="qd-mark" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
    <image width="128" height="128" href="data:image/png;base64,"/>
  </mask>
  <rect width="128" height="128" fill="currentColor" mask="url(#qd-mark)"/>
</svg>
