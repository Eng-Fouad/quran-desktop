<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- The Mushaf's grab cursor on Windows (MushafView): an open hand, white with a 1 px black outline like the
       system cursors, hotspot 17 18 (the palm). Edges on whole units, so 1x and 2x rasterise crisp. The outline is the
       outer half of a 2-unit stroke under the white fill of the same shapes, so it follows their union. -->
  <defs>
    <g id="hand">
      <rect x="8" y="8" width="4" height="11" rx="2"/>
      <rect x="13" y="5" width="4" height="14" rx="2"/>
      <rect x="18" y="6" width="4" height="13" rx="2"/>
      <rect x="23" y="9" width="4" height="10" rx="2"/>
      <rect x="9" y="13" width="4" height="12" rx="2" transform="rotate(-48 11 24)"/>
      <path d="M8 14H27V20C27 24.5 24.5 27.5 20.5 27.5H15C12.5 27.5 10.5 26.5 9 25Z"/>
    </g>
  </defs>
  <use href="#hand" fill="#000" stroke="#000" stroke-width="2" stroke-linejoin="round"/>
  <use href="#hand" fill="#fff"/>
</svg>
