<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- The Mushaf's grabbing cursor on Windows (MushafView): the closed hand of grab.svg, same palm and hotspot
       (17 18), so the hand does not move when a drag starts. -->
  <defs>
    <g id="hand">
      <rect x="8" y="11" width="4" height="7" rx="2"/>
      <rect x="13" y="10" width="4" height="8" rx="2"/>
      <rect x="18" y="10" width="4" height="8" rx="2"/>
      <rect x="23" y="12" width="4" height="6" rx="2"/>
      <rect x="9" y="17" width="4" height="8" rx="2" transform="rotate(-50 11 24)"/>
      <path d="M8 15H27V20C27 24.5 24.5 27.5 20.5 27.5H15C12.5 27.5 10.5 26.5 9 25Z"/>
    </g>
  </defs>
  <use href="#hand" fill="#000" stroke="#000" stroke-width="2" stroke-linejoin="round"/>
  <use href="#hand" fill="#fff"/>
</svg>
